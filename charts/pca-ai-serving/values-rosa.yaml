model:
  id: "Qwen/Qwen3.6-35B-A3B-FP8"
  name: "qwen3-coder"
  poolName: "qwen3-coder-inference-pool"
tokens:
  total: 32000
  output: 8192
vllm:
  reasoningParser: "qwen3"
hardware:
  # Seoul (ap-northeast-2) deployment uses g6e.12xlarge (4x L40S) machine pool.
  # Must match the actual node instance-type label or the vLLM pod nodeSelector
  # will never match and the pod stays Pending forever.
  gpuProduct: "g6e.12xlarge"
  instanceTypeLabel: "node.kubernetes.io/instance-type"
  # Single-GPU serving (1 of 4 GPUs on the node) — safe default, no tensor
  # parallelism. Bump to 4 + add --tensor-parallel-size=4 to vllm.extraArgs
  # later if full-node utilization / higher concurrency is desired.
  gpuCount: 1
  cpu:
    request: "2"
    limit: "4"
  memory:
    request: 16Gi
    limit: 48Gi
storage:
  storageClass: "gp3-csi"
  modelCacheSize: 100Gi
# LLMInferenceService no longer auto-creates the kserve self-signed cert
# secret that both Gateways' listeners reference by default, so without this
# job neither Gateway's HTTPS listener ever programs (envoy refuses
# connections on 443 with "invalid certificate reference"). See ARO's and
# deploy_existing_openshift's values files, which already carry this fix.
tlsJob:
  enabled: true
observability:
  enabled: true
pca-observability:
  grafana:
    enabled: true
  langfuse:
    enabled: false
  prometheus:
    accessMode: cluster
